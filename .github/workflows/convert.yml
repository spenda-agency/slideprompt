name: デザイン適用済みスライド作成
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Marp CLIをインストール
        run: npm install -g @marp-team/marp-cli@4.0.3

      - name: 日本語フォントをインストール
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      # ルート直下の「marp: true」を含む .md をすべて PDF / PPTX に変換する。
      # テーマは style.css（spenda-style・旧デザイン）と themes/spenda-detail.css（PPT詳細テンプレ）の両方を読み込み、
      # 各mdの「theme:」指定で使い分ける。
      - name: スライドをPDF・PPTXに変換
        run: |
          mkdir -p output
          for f in *.md; do
            grep -q '^marp: true' "$f" || continue
            name="${f%.md}"
            marp "$f" --theme-set style.css themes/spenda-detail.css --allow-local-files --pdf --output "output/${name}.pdf"
            marp "$f" --theme-set style.css themes/spenda-detail.css --allow-local-files --pptx --output "output/${name}.pptx"
          done

      - name: 成果物を保存
        uses: actions/upload-artifact@v4
        with:
          name: presentation-files
          path: output/

      - name: 成果物をGitHubにコミット
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/
          git commit -m "Add converted presentation files" || exit 0
          git push
